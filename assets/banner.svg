<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient for Text/Shapes -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    
    /* Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.2; }
    }
    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    
    .bg-circle-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 1050px 80px;
    }
    .bg-circle-2 {
      animation: pulseGlow 8s ease-in-out infinite 2s;
      transform-origin: 150px 220px;
    }
    .particle {
      animation: floatParticle 7s ease-in-out infinite;
      transform-origin: center;
    }
    .wave-line {
      stroke-dasharray: 20 10;
      animation: waveMove 30s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0V300 M200 0V300 M300 0V300 M400 0V300 M500 0V300 M600 0V300 M700 0V300 M800 0V300 M900 0V300 M1000 0V300 M1100 0V300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dynamic Background Geometric Elements (Behind Text) -->
  <circle class="bg-circle-1" cx="1050" cy="80" r="140" fill="#818cf8" filter="url(#glow)" opacity="0.25" />
  <circle class="bg-circle-2" cx="150" cy="220" r="110" fill="#38bdf8" filter="url(#glow)" opacity="0.2" />

  <!-- Animated Dynamic Waves in Background -->
  <path class="wave-line" d="M -100 240 Q 300 160 700 260 T 1300 200" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />
  <path class="wave-line" d="M -100 260 Q 400 300 800 180 T 1300 220" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Animated Floating Particles -->
  <polygon class="particle" points="980,60 995,90 965,90" fill="#38bdf8" opacity="0.4" style="animation-delay: 0s;" />
  <circle class="particle" cx="1080" cy="210" r="8" fill="#c084fc" opacity="0.5" style="animation-delay: 1.5s;" />
  <rect class="particle" x="880" y="180" width="12" height="12" rx="2" fill="#818cf8" opacity="0.4" style="animation-delay: 3s;" />
  <circle class="particle" cx="220" cy="70" r="6" fill="#38bdf8" opacity="0.4" style="animation-delay: 2s;" />

  <!-- Foreground Decorative Pill Badge -->
  <g transform="translate(80, 55)">
    <rect width="240" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="12" y="19" class="tag">🏛️ CIVIC TECH &amp; GOVTECH</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <text x="80" y="135" class="title">Awesome Municipal ERP 🚀</text>
  <text x="80" y="175" fill="url(#accentGrad)" font-family="sans-serif" font-weight="700" font-size="22px">
    Fund Accounting • Utility Billing • Governance • Open Source
  </text>
  <text x="80" y="215" class="subtitle">
    Curated SaaS Platforms, Public Accounting Tools &amp; Local Government Ecosystem
  </text>

  <!-- Right Accent Graphic (Subtle City/Government Columns motif) -->
  <g transform="translate(940, 110)" opacity="0.85">
    <rect x="0" y="70" width="160" height="8" rx="4" fill="#818cf8" />
    <rect x="15" y="20" width="18" height="50" rx="3" fill="url(#accentGrad)" />
    <rect x="53" y="20" width="18" height="50" rx="3" fill="url(#accentGrad)" />
    <rect x="91" y="20" width="18" height="50" rx="3" fill="url(#accentGrad)" />
    <rect x="127" y="20" width="18" height="50" rx="3" fill="url(#accentGrad)" />
    <path d="M 0 20 L 80 0 L 160 20 Z" fill="#38bdf8" />
  </g>
</svg>
